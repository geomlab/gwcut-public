name: stable-bootstrap-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stable-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable launcher syntax and release contract
        run: |
          bash -n stable-bootstrap.sh
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('stable-bootstrap.sh').read_text(encoding='utf-8')
          public = re.search(r"PUBLIC_STAGE0_SHA='([0-9a-f]{40})'", text)
          assert public, 'missing immutable public Stage-0 SHA'
          assert 'raw.githubusercontent.com/geomlab/gwcut-public/${PUBLIC_STAGE0_SHA}/bootstrap.sh' in text
          assert "raw.githubusercontent.com/geomlab/gwcut-public/main/bootstrap.sh" not in text
          assert 'set -euo pipefail' in text
          assert 'set +x' in text
          assert 'umask 077' in text
          assert 'mktemp -d /root/gwcut-stable-bootstrap.XXXXXX' in text
          assert "--proto '=https'" in text
          assert '--tlsv1.2' in text
          assert '\nsource ' not in text
          assert '\neval ' not in text
          PY
      - name: Validate canonical operator runbook contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runbook = Path('BOOTSTRAP_RUNBOOK.md').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          stage0 = Path('bootstrap.sh').read_text(encoding='utf-8')

          assert '[`BOOTSTRAP_RUNBOOK.md`](BOOTSTRAP_RUNBOOK.md)' in readme

          required_fields = [
              'GITHUB_TOKEN=',
              'GHCR_READ_TOKEN=',
              'DASHBOARD_PASSWORD=',
              'S3_ACCESS_KEY=',
              'S3_SECRET_KEY=',
              'S3_BUCKET=',
              'S3_REGION=',
          ]
          for field in required_fields:
              assert runbook.count(field) == 1, field

          forbidden_role_fields = [
              'S3_WORKER_ACCESS_KEY',
              'S3_WORKER_SECRET_KEY',
              'S3_READER_ACCESS_KEY',
              'S3_READER_SECRET_KEY',
              'S3_BACKUP_ACCESS_KEY',
              'S3_BACKUP_SECRET_KEY',
              'S3_PITR_ACCESS_KEY',
              'S3_PITR_SECRET_KEY',
          ]
          for field in forbidden_role_fields:
              assert field not in runbook, field
              assert field not in stage0, field

          required_phrases = [
              'umask 077 && nano /root/gwcut-bootstrap.env && chmod 600 /root/gwcut-bootstrap.env',
              'https://raw.githubusercontent.com/geomlab/gwcut-public/main/stable-bootstrap.sh',
              '&& bash /root/bootstrap.sh </root/gwcut-bootstrap.env',
              'Do not `source` the file',
              'The operator does not provide release SHAs',
              'exactly two visible actions',
              'postgres',
              'api',
              'scheduler',
              'caddy',
              'Remote Desktop Commander is maintenance tooling, not a fifth GWCut service.',
          ]
          for phrase in required_phrases:
              assert phrase in runbook, phrase

          assert "readonly INFRA_SHA='" in stage0
          assert "readonly BOOTSTRAP_PATH='deploy/compose/bootstrap-compose-v1.sh'" in stage0
          assert '/opt/gwcut/updater-github-token' not in stage0
          assert '/opt/gwcut/ghcr-read-token' not in stage0
          assert 'fresh-bootstrap.sh' not in stage0
          PY
