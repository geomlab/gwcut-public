name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stage0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n bootstrap.sh
      - name: Validate public bootstrap security contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("bootstrap.sh").read_text(encoding="utf-8")
          required = [
              'set -euo pipefail',
              'set +x',
              'umask 077',
              'readonly REPO_URL="https://github.com/geomlab/gwcut-infra.git"',
              'readonly TOKEN_FILE="/opt/gwcut/updater-github-token"',
              'readonly GHCR_TOKEN_FILE="/opt/gwcut/ghcr-read-token"',
              'readonly AUTH_DIR="/opt/gwcut/auth"',
              'readonly BOOTSTRAP_MODE="${GWCUT_BOOTSTRAP_MODE:-auto}"',
              'GWCUT_INFRA_GIT_SHA is required',
              'GWCUT_INFRA_GIT_SHA must be a full lowercase commit SHA',
              'target_sha="$GWCUT_INFRA_GIT_SHA"',
              'auto|first-install|host',
              'GITHUB_TOKEN|GHCR_READ_TOKEN|DASHBOARD_PASSWORD|S3_WORKER_ACCESS_KEY|S3_WORKER_SECRET_KEY|S3_READER_ACCESS_KEY|S3_READER_SECRET_KEY|S3_BACKUP_ACCESS_KEY|S3_BACKUP_SECRET_KEY|S3_PITR_ACCESS_KEY|S3_PITR_SECRET_KEY|S3_BUCKET|S3_REGION',
              'S3_WORKER_ACCESS_KEY S3_WORKER_SECRET_KEY',
              'S3_READER_ACCESS_KEY S3_READER_SECRET_KEY',
              'S3_BACKUP_ACCESS_KEY S3_BACKUP_SECRET_KEY',
              'S3_PITR_ACCESS_KEY S3_PITR_SECRET_KEY',
              'apt-get install -y --no-install-recommends ca-certificates curl git',
              'install -d -o root -g root -m 0700 "$AUTH_DIR"',
              'askpass="${AUTH_DIR}/stage0-askpass.$$"',
              'printf \'%s\\n\' "$GITHUB_TOKEN" >"$TOKEN_FILE"',
              'printf \'%s\\n\' "$GHCR_READ_TOKEN" >"$GHCR_TOKEN_FILE"',
              'chown root:root "$TOKEN_FILE"',
              'chmod 0600 "$TOKEN_FILE"',
              'git -C "$partial" fetch --depth=1 origin "$target_sha"',
              'git -C "$partial" rev-parse HEAD',
              'export GIT_TERMINAL_PROMPT=0',
              'existing GWCut installation is a different SHA',
              'database-decision.json',
              'state not in {"fresh-empty", "restored", "existing"}',
              'science.get("status") != "passed"',
              'science.get("fresh_submission") is not True',
              'fresh-bootstrap.sh',
          ]
          for needle in required:
              assert needle in text, needle

          forbidden = [
              '\nsource ',
              '\n. /',
              'eval ',
              'set -x',
              'git ls-remote',
              'refs/heads/main',
              'sha256:',
              'gwcut-worker',
              'DATABASE_URL=',
              '/run/gwcut-stage0-askpass',
              'https://x-access-token:',
              'S3_ACCESS_KEY=""',
              'S3_SECRET_KEY=""',
              'GWCUT_REQUIRE_FRESH_SCIENCE_SMOKE',
          ]
          for needle in forbidden:
              assert needle not in text, needle

          assert text.count("printf 'DASHBOARD_PASSWORD=%s\\n'") == 1
          for role in ('WORKER', 'READER', 'BACKUP', 'PITR'):
              assert text.count(f"printf 'S3_{role}_ACCESS_KEY=%s\\n'") == 1
              assert text.count(f"printf 'S3_{role}_SECRET_KEY=%s\\n'") == 1
          assert 'S3_ACCESS_KEY="$S3_PITR_ACCESS_KEY"' in text
          assert 'S3_SECRET_KEY="$S3_PITR_SECRET_KEY"' in text
          assert 'env GWCUT_INFRA_GIT_SHA=' not in text
          assert 'existing GWCut installation detected' not in text
          assert 'fresh bootstrap requires Ubuntu 24.04' in text
          PY
      - name: Validate SSH-safe and history-safe operator boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shlex
          import subprocess
          import tempfile

          readme = Path("README.md").read_text(encoding="utf-8")
          start_marker = "<!-- ssh-safe-one-paste:start -->"
          end_marker = "<!-- ssh-safe-one-paste:end -->"
          assert readme.count(start_marker) == 1
          assert readme.count(end_marker) == 1
          block = readme.split(start_marker, 1)[1].split(end_marker, 1)[0]

          assert 'if shopt -qo history; then' in block
          assert 'GWCUT_HISTORY_WAS_ON=1\n  set +o history' in block
          assert 'GWCUT_HISTORY_WAS_ON=0' in block
          assert 'case $- in' not in block

          boundary = ") <<'GWCUT_OPERATOR'"
          assert boundary in block
          outer, remainder = block.split(boundary, 1)

          assert 'exec /bin/bash' in outer
          assert 'exec sudo -H /bin/bash' in outer
          assert 'set -e' not in outer
          assert 'set -u' not in outer
          assert 'set -o pipefail' not in outer
          assert 'set +x' not in outer
          assert 'umask ' not in outer
          assert '\nexit ' not in outer

          heredoc_end = "\nGWCUT_OPERATOR\n"
          assert heredoc_end in remainder
          child, after = remainder.split(heredoc_end, 1)
          assert 'set -euo pipefail' in child
          assert 'set +x' in child
          assert 'umask 077' in child
          assert 'GWCUT_CHILD_RC=$?' in after
          assert 'if [ "$GWCUT_HISTORY_WAS_ON" = 1 ]; then' in after
          assert 'set -o history' in after
          assert 'unset GWCUT_HISTORY_WAS_ON' in after
          assert 'exit ' not in after

          sentinel = "GW_SECRET_HISTORY_SENTINEL_8fb1c2b0"
          with tempfile.TemporaryDirectory() as directory:
              histfile = Path(directory) / "history"
              probe = f'''HISTFILE={shlex.quote(str(histfile))}
          HISTSIZE=1000
          HISTFILESIZE=1000
          set -o history
          set +H
          shopt -qo history || exit 91
          if shopt -qo history; then
            GWCUT_HISTORY_WAS_ON=1
            set +o history
          else
            GWCUT_HISTORY_WAS_ON=0
          fi
          (
            exec /bin/bash
          ) <<'GWCUT_OPERATOR'
          set -euo pipefail
          cat >/dev/null <<'SECRET'
          {sentinel}
          SECRET
          exit 23
          GWCUT_OPERATOR
          GWCUT_CHILD_RC=$?
          if [ "$GWCUT_HISTORY_WAS_ON" = 1 ]; then
            set -o history
          fi
          unset GWCUT_HISTORY_WAS_ON
          test "$GWCUT_CHILD_RC" -eq 23
          unset GWCUT_CHILD_RC
          printf 'ssh-parent-survived\\n'
          history -w
          exit
          '''
              completed = subprocess.run(
                  ["bash", "--noprofile", "--norc", "-i"],
                  input=probe,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              assert completed.returncode == 0, (completed.returncode, completed.stderr)
              assert 'ssh-parent-survived' in completed.stdout
              history_text = histfile.read_text(encoding="utf-8")
              assert sentinel not in history_text
              assert 'set +o history' in history_text
              assert 'set -o history' in history_text
          PY
