name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stage0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n bootstrap.sh
      - name: Validate public Compose bootstrap security contract
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("bootstrap.sh").read_text(encoding="utf-8")

          required = [
              'set -euo pipefail',
              'set +x',
              'umask 077',
              "readonly INFRA_SHA='",
              "readonly INFRA_REPO='geomlab/gwcut-infra'",
              "readonly BOOTSTRAP_PATH='deploy/compose/bootstrap-compose-v1.sh'",
              'command -v curl >/dev/null 2>&1',
              'GITHUB_TOKEN|GHCR_READ_TOKEN|DASHBOARD_PASSWORD|S3_ACCESS_KEY|S3_SECRET_KEY|S3_BUCKET|S3_REGION',
              'https://api.github.com/repos/${INFRA_REPO}/contents/${BOOTSTRAP_PATH}?ref=${INFRA_SHA}',
              'Authorization: Bearer ${GITHUB_TOKEN}',
              'application/vnd.github.raw+json',
              "--proto '=https'",
              '--tlsv1.2',
              'unset GITHUB_TOKEN',
              'GITHUB_TOKEN=not-persisted-stage0-token',
              "printf 'GHCR_READ_TOKEN=%s\\n'",
              "printf 'DASHBOARD_PASSWORD=%s\\n'",
              "printf 'S3_ACCESS_KEY=%s\\n'",
              "printf 'S3_SECRET_KEY=%s\\n'",
              "printf 'S3_BUCKET=%s\\n'",
              "printf 'S3_REGION=%s\\n'",
              '/bin/bash "$bootstrap"',
          ]
          for needle in required:
              assert needle in text, needle

          match = re.search(r"readonly INFRA_SHA='([0-9a-f]{40})'", text)
          assert match, 'missing immutable infra SHA'

          forbidden = [
              '\nsource ',
              '\n. /',
              'eval ',
              'set -x',
              'git clone',
              'git fetch',
              'git ls-remote',
              'refs/heads/main',
              '/opt/gwcut/updater-github-token',
              '/opt/gwcut/ghcr-read-token',
              'GIT_ASKPASS',
              'fresh-bootstrap.sh',
              'pitr-restore-drill.sh',
              'DATABASE_URL=',
              'S3_WORKER_ACCESS_KEY',
              'S3_READER_ACCESS_KEY',
              'S3_BACKUP_ACCESS_KEY',
              'S3_PITR_ACCESS_KEY',
          ]
          for needle in forbidden:
              assert needle not in text, needle

          fields = [
              'GITHUB_TOKEN',
              'GHCR_READ_TOKEN',
              'DASHBOARD_PASSWORD',
              'S3_ACCESS_KEY',
              'S3_SECRET_KEY',
              'S3_BUCKET',
              'S3_REGION',
          ]
          for field in fields:
              assert f'{field}=""' in text, field

          assert text.count("printf 'DASHBOARD_PASSWORD=%s\\n'") == 1
          assert text.count("printf 'S3_ACCESS_KEY=%s\\n'") == 1
          assert text.count("printf 'S3_SECRET_KEY=%s\\n'") == 1
          assert 'https://x-access-token:' not in text
          assert 'raw.githubusercontent.com/geomlab/gwcut-infra/main/' not in text
          PY
      - name: Validate SSH-safe and history-safe operator boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shlex
          import subprocess
          import tempfile

          readme = Path("README.md").read_text(encoding="utf-8")
          start_marker = "<!-- ssh-safe-one-paste:start -->"
          end_marker = "<!-- ssh-safe-one-paste:end -->"
          assert readme.count(start_marker) == 1
          assert readme.count(end_marker) == 1
          block = readme.split(start_marker, 1)[1].split(end_marker, 1)[0]

          assert 'if shopt -qo history; then' in block
          assert 'GWCUT_HISTORY_WAS_ON=1\n  set +o history' in block
          assert 'GWCUT_HISTORY_WAS_ON=0' in block
          assert 'case $- in' not in block

          boundary = ") <<'GWCUT_OPERATOR'"
          assert boundary in block
          outer, remainder = block.split(boundary, 1)

          assert 'exec /bin/bash' in outer
          assert 'exec sudo -H /bin/bash' in outer
          assert 'set -e' not in outer
          assert 'set -u' not in outer
          assert 'set -o pipefail' not in outer
          assert 'set +x' not in outer
          assert 'umask ' not in outer
          assert '\nexit ' not in outer

          heredoc_end = "\nGWCUT_OPERATOR\n"
          assert heredoc_end in remainder
          child, after = remainder.split(heredoc_end, 1)
          assert 'set -euo pipefail' in child
          assert 'set +x' in child
          assert 'umask 077' in child
          assert 'GWCUT_CHILD_RC=$?' in after
          assert 'if [ "$GWCUT_HISTORY_WAS_ON" = 1 ]; then' in after
          assert 'set -o history' in after
          assert 'unset GWCUT_HISTORY_WAS_ON' in after
          assert 'exit ' not in after

          sentinel = "GW_SECRET_HISTORY_SENTINEL_8fb1c2b0"
          with tempfile.TemporaryDirectory() as directory:
              histfile = Path(directory) / "history"
              probe = f'''HISTFILE={shlex.quote(str(histfile))}
          HISTSIZE=1000
          HISTFILESIZE=1000
          set -o history
          set +H
          shopt -qo history || exit 91
          if shopt -qo history; then
            GWCUT_HISTORY_WAS_ON=1
            set +o history
          else
            GWCUT_HISTORY_WAS_ON=0
          fi
          (
            exec /bin/bash
          ) <<'GWCUT_OPERATOR'
          set -euo pipefail
          cat >/dev/null <<'SECRET'
          {sentinel}
          SECRET
          exit 23
          GWCUT_OPERATOR
          GWCUT_CHILD_RC=$?
          if [ "$GWCUT_HISTORY_WAS_ON" = 1 ]; then
            set -o history
          fi
          unset GWCUT_HISTORY_WAS_ON
          test "$GWCUT_CHILD_RC" -eq 23
          unset GWCUT_CHILD_RC
          printf 'ssh-parent-survived\\n'
          history -w
          exit
          '''
              completed = subprocess.run(
                  ["bash", "--noprofile", "--norc", "-i"],
                  input=probe,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              assert completed.returncode == 0, (completed.returncode, completed.stderr)
              assert 'ssh-parent-survived' in completed.stdout
              history_text = histfile.read_text(encoding="utf-8")
              assert sentinel not in history_text
              assert 'set +o history' in history_text
              assert 'set -o history' in history_text
          PY
