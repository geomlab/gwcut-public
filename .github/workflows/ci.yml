name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deployment-kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap shell syntax
        run: bash -n bootstrap.sh
      - name: Validate Compose configuration
        run: |
          cat > /tmp/gwcut.env <<'EOF'
          COMPOSE_PROJECT_NAME=gwcut
          POSTGRES_PASSWORD=test
          GWCUT_CONTROL_TOKEN=test
          GWCUT_INTERNAL_TOKEN=test
          GWCUT_INFRA_IMAGE=ghcr.io/geomlab/gwcut-infra:main
          GWCUT_SCIENCE_IMAGE_DIGEST=sha256:8a1912c584e2d187e2d944a6d830f5b8af1715fd33a96ede85bc1cbb58086106
          GWCUT_SCIENCE_IMAGE_REFERENCE=ghcr.io/geomlab/gwcut@sha256:8a1912c584e2d187e2d944a6d830f5b8af1715fd33a96ede85bc1cbb58086106
          GWCUT_IMAGE_SPECS_JSON='{"sha256:8a1912c584e2d187e2d944a6d830f5b8af1715fd33a96ede85bc1cbb58086106":{"reference":"ghcr.io/geomlab/gwcut@sha256:8a1912c584e2d187e2d944a6d830f5b8af1715fd33a96ede85bc1cbb58086106","entrypoint":"gwcut-worker"}}'
          GWCUT_PUBLIC_HOST=8.8.8.8
          GWCUT_MAX_WORKERS=4
          GWCUT_MEMORY_BUDGET_MIB=12288
          GWCUT_CPU_BUDGET=6
          GWCUT_DISK_BUDGET_MIB=102400
          S3_ENDPOINT=https://fsn1.your-objectstorage.com
          S3_BUCKET=test-bucket
          S3_ACCESS_KEY=test
          S3_SECRET_KEY=test
          GWCUT_ARTIFACT_S3_REGION=fsn1
          EOF
          docker compose --env-file /tmp/gwcut.env -f compose.production.yml config >/tmp/compose.rendered.yml
      - name: Require core services
        run: |
          services="$(docker compose --env-file /tmp/gwcut.env -f compose.production.yml config --services)"
          for required in api caddy postgres scheduler; do
            printf '%s\n' "$services" | grep -Fxq "$required"
          done
      - name: Validate Caddyfile
        run: docker run --rm -e GWCUT_PUBLIC_HOST=8.8.8.8 -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.3-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate simplified bootstrap contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bootstrap = Path("bootstrap.sh").read_text(encoding="utf-8")
          compose = Path("compose.production.yml").read_text(encoding="utf-8")
          required = ["set -euo pipefail", "set +x", "umask 077", "ghcr.io/geomlab/gwcut-infra:main", "sha256:8a1912c584e2d187e2d944a6d830f5b8af1715fd33a96ede85bc1cbb58086106", "/opt/gwcut/compose.production.yml", "/opt/gwcut/Caddyfile", "docker compose"]
          for needle in required:
              assert needle in bootstrap, needle
          forbidden = ["INFRA_SHA", "GWCUT_INFRA_GIT_SHA", "stable-bootstrap.sh", "git clone", "git fetch", "refs/heads/main", "deploy/compose/bootstrap-compose-v1.sh", "/opt/gwcut/deploy/compose/Caddyfile", "npm install", "desktop-commander", "pgbackrest", "systemd/gwcut-"]
          for needle in forbidden:
              assert needle not in bootstrap, needle
          assert "caddy:2.11.3-alpine" in compose
          assert "caddy:2-alpine" not in compose
          assert "./Caddyfile:/etc/caddy/Caddyfile:ro" in compose
          assert "ghcr.io/geomlab/gwcut-analysis@sha256:536f5eac81e82489108f10dddfcc1e491609a82f335416ef92c347f836e5bae8" in compose
          assert "GWCUT_UPSTREAM_BASE_URL: http://api:8080" in compose
          assert bootstrap.index("apt-get install") < bootstrap.index("command -v curl")
          science = "sha256:8a1912c584e2d187e2d944a6d830f5b8af1715fd33a96ede85bc1cbb58086106"
          assert bootstrap.count(science) >= 2
          PY
